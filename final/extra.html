<script>
  const music = document.getElementById("bg-music");
  const btn = document.getElementById("music-btn");

  music.volume = 0.2; // Keep background music quiet

  // Plays when mouse hovers over the button
  btn.addEventListener("mouseenter", () => {
    music.play().catch((error) => {
      // Handles browser security restrictions
      console.log("Audio blocked. The user must click the page once first.");
      btn.innerText = "⚠️ Click once to enable hover music";
    });

    if (!music.paused) {
      btn.innerText = "🔊 Playing (Hovered)";
    }
  });

  // Pauses when mouse leaves the button
  btn.addEventListener("mouseleave", () => {
    music.pause();
    btn.innerText = "🎵 Hover to Play";
  });
</script>

<!-- Bootstrap Welcome Modal -->
<div
  class="modal fade"
  id="welcomeModal"
  data-bs-backdrop="static"
  data-bs-keyboard="false"
  tabindex="-1"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <div class="modal-body">
        <h3 class="mb-3">Welcome to My Website</h3>
        <p class="text-muted">
          This site features background music for the best experience.
        </p>
        <!-- The button that closes the popup and starts the music -->
        <button id="enter-btn" class="btn btn-primary btn-lg mt-2">
          Enter Website
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Hidden Audio Element -->
<audio id="bg-music" loop>
  <source src="your-audio-file.mp3" type="audio/mpeg" />
</audio>

<script>
  // Wait until the HTML document is fully loaded
  document.addEventListener("DOMContentLoaded", () => {
    const music = document.getElementById("bg-music");
    const enterBtn = document.getElementById("enter-btn");

    // Initialize the Bootstrap Modal
    const welcomeModal = new bootstrap.Modal(
      document.getElementById("welcomeModal"),
    );

    // Set a comfortable background music volume
    music.volume = 0.2;

    // Show the popup automatically on page load
    welcomeModal.show();

    // Listen for the button click
    enterBtn.addEventListener("click", () => {
      // 1. Play the music (unlocked successfully by the click)
      music.play();

      // 2. Hide the popup window
      welcomeModal.hide();
    });
  });
</script>
